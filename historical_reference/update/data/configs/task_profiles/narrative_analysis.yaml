# Narrative Analysis — mission-agnostic; comprehensive narrative structure and quality analysis.

task_id: narrative_analysis
name: "Narrative Analysis"

artifact:
  artifact_type: NARRATIVE_ANALYSIS
  schema_ref: narrative_analysis.schema.json

retrieval:
  mode: doc_file
  # doc_path passed at runtime from input

# Use graph-based prompt system with default template
prompt_template: "default.yaml"

failure_behavior:
  on_validation_failure:
    save_partial: true
    save_raw_response: true
    exit_code: 1
    message: "Narrative analysis output failed schema validation; partial outputs saved."
  on_llm_error:
    exit_code: 2
    message: "LiteLLM API error. Ensure VPN is connected if required."
  on_parse_error:
    save_partial: true
    save_raw_response: true
    exit_code: 2
    message: "Could not extract valid JSON from LLM response."

description: |
  Conduct comprehensive narrative analysis including: structure extraction, actor identification,
  intent statement detection, ambiguity detection, redundancy detection, clarity evaluation,
  logical coherence analysis, missing component identification, and persuasive strength assessment.
  All analysis must cite evidence sources.
